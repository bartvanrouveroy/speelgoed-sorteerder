<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speelgoed Sorteerder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Speelgoed">
<meta name="theme-color" content="#FFF6EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6EC;--card:#fff;--ink:#2A2340;--muted:#7B7391;--line:#EFE4D6;--coral:#FF6B4A;--coral2:#FFE4DB;--teal:#16A394;--teal2:#D5F3EE;--sun:#F5A800;--sun2:#FFF0C4;--plum:#7A5AF8;--plum2:#ECE6FF;--r:18px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.btn svg{width:21px;height:21px;flex:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:16px;font-weight:600}
body{min-height:100vh;padding-bottom:calc(92px + var(--sab))}
button,input,textarea,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,246,236,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:23px;font-weight:900;margin:0;flex:1;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;flex:none;border-radius:14px;border:0;background:#fff;box-shadow:0 1px 0 var(--line),0 4px 14px -8px rgba(42,35,64,.3);display:grid;place-items:center;font-size:20px;color:var(--ink);cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.iconbtn.coral{background:var(--coral);color:#fff}
main{padding:6px 16px 24px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + var(--sab))}
nav.tabs button{flex:1;border:0;background:none;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--coral)}
nav.tabs button.fab span.ring{width:60px;height:60px;margin-top:-26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(255,107,74,.7);border:4px solid #fff}
nav.tabs button.fab svg{width:28px;height:28px}
.card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(42,35,64,.3);margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px;font-weight:900}
.card h3{margin:0 0 6px;font-size:15px;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;background:#F3ECE3;color:var(--ink);cursor:pointer;text-decoration:none;min-height:48px}
.btn.block{width:100%}
.btn.primary{background:var(--coral);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.plum{background:var(--plum);color:#fff}
.btn.soft{background:var(--coral2);color:#C2391A}
.btn.danger{background:#FFE1E1;color:#C42525}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.grow{flex:1;min-width:0}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.big-act{border:0;border-radius:20px;padding:16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:112px;font-weight:900;font-size:17px}
.big-act small{font-weight:700;font-size:12.5px;opacity:.85}
.big-act .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.3);display:grid;place-items:center}
.big-act .ic svg{width:24px;height:24px}
.big-act.coral{background:var(--coral);color:#fff}
.big-act.teal{background:var(--teal);color:#fff}
label.f{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.input,textarea.input,select.input{width:100%;border:2px solid var(--line);background:#FFFCF8;border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--coral)}
textarea.input{min-height:84px;resize:vertical}
.search{position:relative}
.search input{padding-left:44px;background:#fff;border-color:#fff;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(42,35,64,.35);height:54px;font-size:17px}
.search svg{position:absolute;left:14px;top:15px;width:24px;height:24px;color:var(--muted)}
.seg{display:flex;background:#F1E8DD;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid2{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 20px -16px rgba(42,35,64,.35);cursor:pointer;border:0;padding:0;text-align:left}
.tile .ph{aspect-ratio:1;background:#F3EADF;display:grid;place-items:center;font-size:34px}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tx{padding:8px 10px 10px}
.tile .nm{font-weight:900;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .lc{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 1px 0 var(--line),0 8px 20px -18px rgba(42,35,64,.35);cursor:pointer;width:100%;border:0;text-align:left}
.li .th{width:58px;height:58px;border-radius:12px;background:#F3EADF;flex:none;overflow:hidden;display:grid;place-items:center;font-size:26px}
.li .th img{width:100%;height:100%;object-fit:cover}
.li .nm{font-weight:900;font-size:16px;line-height:1.2}
.li .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.li .chev{color:#C9BFB2;font-size:22px}
.code{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:12.5px;padding:3px 8px;border-radius:8px;letter-spacing:.3px;white-space:nowrap}
.code.bak{background:var(--coral2);color:#C2391A}
.code.doos{background:var(--sun2);color:#8A5D00}
.code.locatie{background:var(--teal2);color:#0B6F64}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.path a{color:var(--ink);text-decoration:none;font-weight:800}
.path .sep{opacity:.5}
.hero-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:#F3EADF;display:block}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.photos img{height:250px;width:auto;max-width:86%;border-radius:16px;scroll-snap-align:start;object-fit:cover;background:#F3EADF}
.ph-edit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph-edit .p{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#F3EADF}
.ph-edit .p img{width:100%;height:100%;object-fit:cover}
.ph-edit .p button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer}
.ph-edit .add{aspect-ratio:1;border-radius:12px;border:2px dashed #E2D4C3;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;background:#FFFCF8}
.ph-edit .add b{display:block;font-size:24px}
.where{border-radius:var(--r);padding:14px;background:linear-gradient(135deg,var(--teal) 0%,#0E8C80 100%);color:#fff;display:flex;gap:12px;align-items:center;cursor:pointer}
.where .th{width:74px;height:74px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.2);flex:none;display:grid;place-items:center;font-size:30px}
.where .th img{width:100%;height:100%;object-fit:cover}
.where .wl{font-size:12px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.where .nm{font-size:20px;font-weight:900;line-height:1.15}
.where .pt{font-size:13px;opacity:.9;margin-top:3px}
.where.none{background:#F1E8DD;color:var(--ink)}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:flex;gap:14px;align-items:center}
.qrbox svg{width:120px;height:120px;flex:none}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .e{font-size:46px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#F1E8DD;font-size:12.5px;font-weight:800;margin:0 4px 4px 0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.stats .pill{background:#fff;box-shadow:0 1px 0 var(--line)}
.score{height:8px;border-radius:9px;background:#F1E8DD;overflow:hidden;margin-top:6px}
.score i{display:block;height:100%;background:var(--teal);border-radius:9px}
.match-top{border:3px solid var(--teal)}
.qimg{width:110px;height:110px;border-radius:16px;object-fit:cover;flex:none;background:#F3EADF}
.ai{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--plum2);color:#4B33B5}
.ai.off{background:#F1E8DD;color:var(--muted)}
.testrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.testrow img{width:76px;height:76px;border-radius:12px;object-fit:cover;cursor:pointer;flex:none;border:3px solid #fff;box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.banner{background:var(--sun2);color:#6B4A00;border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.steps{counter-reset:s;padding:0;margin:8px 0 0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:4px 0 8px 36px;font-size:14.5px}
.steps li:before{content:counter(s);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--coral2);color:#C2391A;font-weight:900;display:grid;place-items:center;font-size:14px}
/* sheet & overlay */
.backdrop{position:fixed;inset:0;background:rgba(30,22,45,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + var(--sab));overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#DCCFC0;margin:2px auto 10px}
.sheet h2{margin:0 0 10px;font-size:20px;font-weight:900}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:90;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:fd .2s}
.scanner{position:fixed;inset:0;background:#111;z-index:80;display:flex;flex-direction:column;color:#fff}
.scanner .top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat)) 16px 12px}
.scanner .view{position:relative;flex:1;overflow:hidden;display:grid;place-items:center}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .frame{width:64vw;max-width:300px;aspect-ratio:1;border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:3px solid #fff;position:relative;z-index:2}
.scanner .msg{position:absolute;bottom:18px;left:16px;right:16px;text-align:center;z-index:3;font-size:14px;font-weight:800;text-shadow:0 1px 4px #000}
.scanner .bottom{padding:14px 16px calc(16px + var(--sab));display:flex;flex-direction:column;gap:10px;background:#1B1726}
.scanner .bottom .input{background:#2A2438;border-color:#2A2438;color:#fff}
.busy{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.check{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border-radius:14px;margin-bottom:6px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--coral)}
/* labels */
#print-area{display:none}
.lblgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lbl{border:2px dashed #D9CBB9;border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;background:#fff}
.lbl svg{width:84px;height:84px;flex:none}
.lbl .c{font-weight:900;font-size:18px;white-space:nowrap}
.lbl .n{font-size:12px;font-weight:800;line-height:1.2}
@media print{
  body{padding:0;background:#fff}
  header.top,nav.tabs,main,.toast,.backdrop{display:none!important}
  #print-area{display:block}
  #print-area .lblgrid{grid-template-columns:repeat(3,1fr);gap:4mm}
  #print-area .lbl{border:1px dashed #999;border-radius:3mm;padding:3mm;break-inside:avoid;height:34mm}
  #print-area .lbl svg{width:28mm;height:28mm}
  #print-area .lbl .c{font-size:16pt}
  #print-area .lbl .n{font-size:9pt}
  @page{margin:10mm}
}
</style>
</head>

<header class="top">
  <button class="iconbtn" id="back" hidden aria-label="Terug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title">Speelgoed</h1>
  <div id="act" class="row"></div>
</header>
<main id="main"></main>
<div id="print-area"></div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Zoeken</button>
  <button data-tab="containers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM18 14h2.5M14 20.5h2"/></svg>Bakken</button>
  <button data-tab="recognize" class="fab"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg></span>Wat is dit?</button>
  <button data-tab="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Artikels</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Meer</button>
</nav>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TYPES={
  bak:{label:'Bak',plural:'Bakken',prefix:'B',emoji:'🧺'},
  doos:{label:'Doos',plural:'Dozen',prefix:'D',emoji:'📦'},
  locatie:{label:'Locatie',plural:'Locaties',prefix:'L',emoji:'📍'}
};
const PREFIX2TYPE={B:'bak',D:'doos',L:'locatie'};
const ICON={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9z"/><circle cx="8.5" cy="8.5" r="1.6"/></svg>'
};
function toast(msg,ms=2400){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),ms)}
function sheet(html,{onMount}={}){
  return new Promise(resolve=>{
    const bd=document.createElement('div');bd.className='backdrop';
    bd.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
    document.body.append(bd);
    const close=v=>{bd.remove();resolve(v)};
    bd.addEventListener('click',e=>{if(e.target===bd)close(null)});
    onMount&&onMount(bd.firstElementChild,close);
  });
}
function confirmBox(msg,{ok='OK',danger=false}={}){
  return sheet(`<h2>${esc(msg)}</h2><div class="row"><button class="btn grow" data-n>Annuleren</button><button class="btn grow ${danger?'danger':'primary'}" data-y>${esc(ok)}</button></div>`,
    {onMount:(el,close)=>{$('[data-n]',el).onclick=()=>close(false);$('[data-y]',el).onclick=()=>close(true)}});
}
function fileInput({capture=false,multiple=false}={}){
  return new Promise(resolve=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';
    if(capture)i.setAttribute('capture','environment');if(multiple)i.multiple=true;
    i.style.display='none';document.body.append(i);
    i.onchange=()=>{const f=[...i.files];i.remove();resolve(f)};
    i.click();
  });
}

/* ============ storage ============ */
const Store={db:null,mem:null,
  async init(){
    try{
      if(!('indexedDB' in window))throw new Error('geen IndexedDB');
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('speelgoed-sorteerder',1);
        r.onupgradeneeded=()=>{const d=r.result;for(const n of['containers','items','photos','meta'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);

function qrText(code){const b=(S.settings.baseUrl||'').trim();return b?b.replace(/#.*$/,'')+'#q-'+code:'SPS:'+code}

  return`<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

function drawQR(ctx,text,x,y,size){
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=size/(n+4);
  ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor(x+(c+2)*cell),Math.floor(y+(r+2)*cell),Math.ceil(cell),Math.ceil(cell));

}
function scanQR({title='Scan een QR-code'}={}){
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.className='scanner';
    ov.innerHTML=`<div class="top"><b style="font-size:18px">${esc(title)}</b><button class="iconbtn" data-x aria-label="Sluiten">✕</button></div>
      <div class="view"><video playsinline muted autoplay></video><div class="frame"></div><div class="msg">Camera starten…</div></div>
      <div class="bottom"><button class="btn primary block" data-photo>${ICON.cam} Foto van QR-code nemen</button>
      <div class="row"><input class="input grow" placeholder="of typ de code, bv. B-001" autocapitalize="characters"><button class="btn teal" data-ok>OK</button></div></div>`;
    document.body.append(ov);
    const video=$('video',ov),msg=$('.msg',ov);let stream=null,raf=0,done=false,frame=0;
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const finish=v=>{if(done)return;done=true;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove();resolve(v)};
    const got=txt=>{const code=parseCode(txt);if(code){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}finish(code);return true}msg.textContent='QR gelezen, maar dit is geen label van deze app';return false};
    $('[data-x]',ov).onclick=()=>finish(null);
    $('[data-ok]',ov).onclick=()=>{const v=$('input',ov).value;const c=parseCode(v);if(c)finish(c);else toast('Ongeldige code — gebruik bv. B-001')};
    $('[data-photo]',ov).onclick=async()=>{const[f]=await fileInput({capture:true});if(!f)return;msg.innerHTML='<span class="busy"></span> QR zoeken…';const t=await decodeQRFromBlob(f);if(!t){msg.textContent='Geen QR-code gevonden. Probeer dichterbij en scherp.';return}got(t)};
    const loop=()=>{
      if(done)return;raf=requestAnimationFrame(loop);if(++frame%3)return;
      if(video.readyState<2||!video.videoWidth)return;
      const w=480,h=Math.round(video.videoHeight*w/video.videoWidth);cv.width=w;cv.height=h;cx.drawImage(video,0,0,w,h);
      const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r&&r.data)got(r.data);
    };
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(s=>{
        if(done){s.getTracks().forEach(t=>t.stop());return}
        stream=s;video.srcObject=s;video.play().catch(()=>{});msg.textContent='Richt de camera op het QR-label';loop();
      }).catch(()=>{msg.textContent='Live camera niet beschikbaar hier — neem een foto van de QR-code.'});
    }else msg.textContent='Live camera niet beschikbaar — neem een foto van de QR-code.';
  });
}

async function loadImage(blob){
  const url=URL.createObjectURL(blob);
  try{const img=new Image();img.src=url;await img.decode();return img}
  finally{setTimeout(()=>URL.revokeObjectURL(url),3000)}
}
function toCanvas(img,max){
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));

}
function squareCanvas(src,size){
  const w=src.width,h=src.height,m=Math.min(w,h);const c=document.createElement('canvas');c.width=c.height=size;

const canvasBlob=(c,q=.82)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
/* handcrafted visual fingerprint: object-weighted colour histogram + spatial edge-orientation histogram */
function features(src){
  const N=96,c=squareCanvas(src,N),d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,N,N).data;
  let br=0,bg=0,bb=0,bn=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(x<5||y<5||x>=N-5||y>=N-5){const i=(y*N+x)*4;br+=d[i];bg+=d[i+1];bb+=d[i+2];bn++}}
  br/=bn;bg/=bn;bb/=bn;
  const HB=12,col=new Float32Array(HB*9+4),lum=new Float32Array(N*N),W=new Float32Array(N*N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const p=y*N+x,i=p*4,r=d[i],g=d[i+1],b=d[i+2];
    const dist=Math.sqrt((r-br)**2+(g-bg)**2+(b-bb)**2)/441;
    const fg=Math.min(1,Math.max(0,(dist-.07)/.2));
    const cx=(x-N/2)/(N/2),cy=(y-N/2)/(N/2),cw=Math.exp(-(cx*cx+cy*cy)/.7);
    const w=cw*(.15+.85*fg);W[p]=w;
    const R=r/255,G=g/255,B=b/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),v=mx,s=mx?(mx-mn)/mx:0;
    lum[p]=.299*R+.587*G+.114*B;

    else{let h;const dd=mx-mn;if(mx===R)h=((G-B)/dd)%6;else if(mx===G)h=(B-R)/dd+2;else h=(R-G)/dd+4;h=(h*60+360)%360;

    col[bin]+=w;

  const G3=3,OB=8,gr=new Float32Array(G3*G3*OB+OB),cell=N/G3;
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){

/* optional AI (MobileNet) — loaded from CDN when internet is available */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.append(s)})}

async function makePhoto(src,owner,ownerId){
  const img=(src instanceof HTMLCanvasElement)?src:await loadImage(src);
  const big=toCanvas(img,1280),th=squareCanvas(big,360);
  const blob=await canvasBlob(big,.82),thumb=await canvasBlob(th,.8);
  const feat=features(big);let emb=null;if(S.ai&&owner==='item')try{emb=embed(big)}catch(e){}
  const p={id:uid(),owner,ownerId,blob,thumb,feat,emb,created:Date.now()};
  await Store.put('photos',p);S.photos.set(p.id,p);return p;
}
async function recognize(src){
  const img=(src instanceof HTMLCanvasElement)?src:await loadImage(src);
  const c=toCanvas(img,720),f=features(c);let e=null;if(S.ai)try{e=embed(c)}catch(err){}
  const out=[];
  for(const it of S.items.values()){
    let best=-1,bp=null;
    for(const pid of it.photoIds||[]){
      const p=S.photos.get(pid);if(!p||!p.feat)continue;
      let s=simFeat(f,p.feat);if(e&&p.emb)s=.75*cosine(e,p.emb)+.25*s;
      if(s>best){best=s;bp=pid}
    }
    if(bp)out.push({item:it,score:best,pid:bp});
  }
  out.sort((a,b)=>b.score-a.score);
  return{canvas:c,results:out.slice(0,6)};
}

function search(q){
  const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return{items:[],containers:[]};
  const hit=hay=>toks.every(t=>hay.includes(t));
  const items=[...S.items.values()].filter(i=>hit(norm([i.name,i.description,(i.tags||[]).join(' '),i.containerId?pathText(i.containerId):'',S.containers.get(i.containerId)?.code].join(' '))));
  const containers=[...S.containers.values()].filter(c=>hit(norm([c.code,c.name,c.description,c.locationText,TYPES[c.type].label,pathText(c.id)].join(' '))));
  const sc=i=>norm(i.name).startsWith(toks[0])?0:1;
  items.sort((a,b)=>sc(a)-sc(b)||(a.name||'').localeCompare(b.name||''));
  return{items,containers};
}

function isReserved(code){const r=(S.settings.reserved||{})[code[0]]||0;return +code.slice(2)<=r}
async function openCode(code){
  const c=byCode(code);if(c){go('container',{id:c.id});return}
  if(isReserved(code)){toast('Nieuw label '+code+' — vul het in');go('containerEdit',{code});return}
  if(await confirmBox(`Code ${code} bestaat nog niet. Nu aanmaken?`,{ok:'Aanmaken'}))go('containerEdit',{code});
}

      <label class="f">Locatie-omschrijving (vrije tekst)</label><input class="input" id="lt" value="${esc(d.locationText)}" placeholder="bv. Zolder, 2de rek bovenaan">
      <label class="f">Omschrijving / inhoud</label><textarea class="input" id="ds" placeholder="bv. Alle auto's, treinen en vliegtuigjes">${esc(d.description)}</textarea>
      <button class="btn primary block" style="margin-top:16px" data-act="save">Bewaren</button>
      ${ex?`<button class="btn danger block" style="margin-top:10px" data-act="del">Verwijderen</button>`:''}`,
    after(m){
      const sync=()=>{d.name=$('#nm',m).value.trim();d.code=$('#cd',m).value.trim().toUpperCase();d.locationText=$('#lt',m).value.trim();d.description=$('#ds',m).value.trim()};
      $$('[data-t]',m).forEach(b=>b.onclick=()=>{sync();const old=d.type;d.type=b.dataset.t;if(d._new&&!p.code&&d.code&&d.code[0]===TYPES[old].prefix)d.code=nextCode(d.type);render()});
      const addPhoto=async cap=>{const[f]=await fileInput({capture:cap});if(!f)return;sync();toast('Foto verwerken…',900);const ph=await makePhoto(f,'container',d.id);if(d.photoId&&d.photoId!==ex?.photoId)await deletePhoto(d.photoId);d.photoId=ph.id;render()};
      $('[data-act=cam]',m).onclick=()=>addPhoto(true);
      $('[data-act=lib]',m).onclick=()=>addPhoto(false);
      $('[data-act=parent]',m).onclick=async()=>{sync();const r=await pickContainer({exclude:d.id,title:'Waar staat dit?',allowNone:true});if(r===undefined)return;d.parentId=r;render()};
      $('[data-act=save]',m).onclick=async()=>{
        sync();const code=parseCode(d.code);
        if(!code){toast('Code moet zijn als B-001, D-001 of L-001');return}
        const other=byCode(code);if(other&&other.id!==d.id){toast('Code '+code+' is al in gebruik');return}
        if(d.parentId&&chain(d.parentId).some(x=>x.id===d.id)){toast('Dat zou een kringloop maken');return}
        d.code=code;if(!d.name)d.name=TYPES[d.type].label+' '+code;
        const{_new,...obj}=d;
        if(ex&&ex.photoId&&ex.photoId!==obj.photoId)await deletePhoto(ex.photoId);
        await saveContainer(obj);toast('Bewaard ✓');
        if(ex)back();else replace('container',{id:obj.id});
      };
      S.cleanup=()=>{
        if(cur.name==='containerEdit'&&cur.p===p)return;
        const saved=S.containers.get(d.id);
        if(d.photoId&&d.photoId!==(saved&&saved.photoId)&&d.photoId!==(ex&&ex.photoId))deletePhoto(d.photoId);
      };
      const del=$('[data-act=del]',m);if(del)del.onclick=async()=>{
        const n=containerItems(d.id).length,k=containerKids(d.id).length;
        if(!await confirmBox(`${d.code} verwijderen?${n||k?` ${n} artikel(s) en ${k} bak(ken) erin krijgen “geen plaats”.`:''}`,{ok:'Verwijderen',danger:true}))return;
        for(const it of containerItems(d.id)){it.containerId=null;await saveItem(it)}
        for(const kc of containerKids(d.id)){kc.parentId=null;await saveContainer(kc)}
        if(ex.photoId)await deletePhoto(ex.photoId);
        S.containers.delete(d.id);await Store.del('containers',d.id);toast('Verwijderd');S.hist=[];tab('containers');
      };
    }};
};

function pickContainer({exclude=null,title='Kies een plaats',allowNone=false}={}){
  // resolves: id | null (no location) | undefined (cancel)
  return new Promise(resolve=>{
    let settled=false;const done=v=>{if(!settled){settled=true;resolve(v)}};
    const banned=new Set();if(exclude){for(const c of S.containers.values())if(chain(c.id).some(x=>x.id===exclude))banned.add(c.id)}
    const list=sortedContainers().filter(c=>!banned.has(c.id));
    sheet(`<h2>${esc(title)}</h2>
      <div class="row" style="margin-bottom:10px"><button class="btn teal grow" data-scan>${ICON.qr} Scan QR-label</button>${allowNone?'<button class="btn" data-none>Geen</button>':''}</div>
      <input class="input" data-q placeholder="Zoek op naam of code" style="margin-bottom:10px">
      <div data-l></div>`,{onMount:(el,close)=>{
        const L=$('[data-l]',el);
        const draw=q=>{const t=norm(q);const r=list.filter(c=>!t||norm(c.code+' '+c.name+' '+pathText(c.id)).includes(t));
          L.innerHTML=r.length?r.map(c=>containerRow(c).replace('data-go="container"','data-pick')).join(''):'<div class="empty">Geen resultaten</div>';
          $$('[data-pick]',L).forEach(b=>b.onclick=e=>{e.stopPropagation();close();done(b.dataset.id)})};
        draw('');$('[data-q]',el).oninput=e=>draw(e.target.value);
        const nb=$('[data-none]',el);if(nb)nb.onclick=()=>{close();done(null)};
        $('[data-scan]',el).onclick=async()=>{const code=await scanQR({title:'Scan het label'});if(!code)return;const c=byCode(code);
          if(!c){toast(code+' is nog niet ingevuld — open het eerst via QR scannen');return}if(banned.has(c.id)){toast('Kan niet in zichzelf');return}close();done(c.id)};
      }}).then(()=>done(undefined));
  });
}

function whereCard(c){
  if(!c)return`<div class="where none"><div class="th">❔</div><div><div class="wl">Hoort in</div><div class="nm">Nog geen plaats</div><div class="pt">Tik op “Verplaatsen” om een bak te kiezen.</div></div></div>`;

        if(!obj.name)obj.name=obj.tags[0]?obj.tags[0][0].toUpperCase()+obj.tags[0].slice(1):'Artikel '+(S.items.size+1);

        for(const pid of[...p._added,...(p.seedPhotoId?[p.seedPhotoId]:[])])if(!keep.has(pid))deletePhoto(pid);
      };
    }};
};

async function labelImages(list){
  const per=24,pages=[];
  for(let s=0;s<list.length;s+=per){
    const cv=document.createElement('canvas');cv.width=1240;cv.height=1754;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
    const cols=3,rows=8,mx=50,my=60,gw=(cv.width-2*mx)/cols,gh=(cv.height-2*my)/rows;
    list.slice(s,s+per).forEach((c,i)=>{const cx=mx+(i%cols)*gw,cy=my+Math.floor(i/cols)*gh;
      x.strokeStyle='#bbb';x.setLineDash([8,6]);x.lineWidth=2;x.strokeRect(cx+6,cy+6,gw-12,gh-12);x.setLineDash([]);
      const q=gh-36;drawQR(x,qrText(c.code),cx+16,cy+18,q);
      x.fillStyle='#000';x.font='900 40px Nunito, Arial, sans-serif';x.fillText(c.code,cx+q+26,cy+70);
      x.font='700 22px Nunito, Arial, sans-serif';wrapText(x,c.name?`${TYPES[c.type].label}: ${c.name}`:`${TYPES[c.type].label}: ……………………`,cx+q+26,cy+104,gw-q-44,26,3)});
    pages.push(cv.toDataURL('image/png'));
  }
  sheet(`<h2>Labels als afbeelding</h2><div class="small muted" style="margin-bottom:10px">Houd de afbeelding ingedrukt → “Bewaar in Foto's” of “Deel”, en druk af op A4.</div>
    ${pages.map(u=>`<img src="${u}" style="width:100%;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 12px -6px rgba(0,0,0,.3)">`).join('')}
    <button class="btn primary block" data-sh>Delen / bewaren</button>`,{onMount:(el)=>{
      $('[data-sh]',el).onclick=async()=>{const files=await Promise.all(pages.map(async(u,i)=>new File([await(await fetch(u)).blob()],`qr-labels-${i+1}.png`,{type:'image/png'})));
        if(!(await shareOrDownload(files)))toast('Houd de afbeelding ingedrukt om te bewaren')}}});
}
function wrapText(x,t,X,Y,w,lh,max){const words=t.split(' ');let line='',n=0;for(const wd of words){const test=line?line+' '+wd:wd;if(x.measureText(test).width>w&&line){x.fillText(line,X,Y);Y+=lh;line=wd;if(++n>=max-1){break}}else line=test}if(line)x.fillText(line,X,Y)}
async function shareOrDownload(files){
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return true}}catch(e){if(e&&e.name==='AbortError')return true}
  try{for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove()}return isTopLevelWeb()}catch(e){return false}
}

/* ============ backup ============ */
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportBackup(){
  toast('Back-up maken…',1500);
  const photos=[];for(const p of S.photos.values())photos.push({...p,blob:await blobToDataURL(p.blob),thumb:p.thumb?await blobToDataURL(p.thumb):null});
  const data={app:'speelgoed-sorteerder',version:1,date:new Date().toISOString(),containers:[...S.containers.values()],items:[...S.items.values()],photos};
  const name=`speelgoed-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([JSON.stringify(data)],name,{type:'application/json'});
  if(!(await shareOrDownload([file])))toast('Back-up downloaden kan alleen in de geïnstalleerde app');
}
async function importBackup(){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;
    try{const data=JSON.parse(await f.text());if(data.app!=='speelgoed-sorteerder')throw 0;
      if(!await confirmBox(`Back-up van ${String(data.date).slice(0,10)} terugzetten? Huidige gegevens worden vervangen.`,{ok:'Terugzetten',danger:true}))return;
      for(const s of['containers','items','photos'])await Store.clear(s);S.containers.clear();S.items.clear();S.photos.clear();
      for(const c of data.containers)await saveContainer(c);for(const it of data.items)await saveItem(it);
      for(const p of data.photos){const q={...p,blob:await(await fetch(p.blob)).blob(),thumb:p.thumb?await(await fetch(p.thumb)).blob():null};await Store.put('photos',q);S.photos.set(q.id,q)}
      toast('Back-up teruggezet ✓');tab('home');
    }catch(e){toast('Dit is geen geldige back-up')}};
  i.click();
}

  bal(x){x.fillStyle='#1E63D6';x.beginPath();x.arc(0,0,175,0,7);x.fill();x.save();x.clip();x.fillStyle='#fff';x.fillRect(-200,-35,400,70);x.fillStyle='#FDD835';x.beginPath();x.arc(0,0,175,-.35,.35);x.lineTo(0,0);x.fill();x.restore();
    x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(-70,-90,45,25,-.6,0,7);x.fill()},
  eend(x){x.fillStyle='#FFD21F';x.beginPath();x.ellipse(-20,60,170,110,0,0,7);x.fill();x.beginPath();x.arc(80,-80,85,0,7);x.fill();
    x.fillStyle='#FF8F00';x.beginPath();x.moveTo(150,-90);x.lineTo(225,-70);x.lineTo(150,-50);x.fill();x.fillStyle='#222';x.beginPath();x.arc(100,-105,13,0,7);x.fill();
    x.fillStyle='#F5B800';x.beginPath();x.ellipse(-50,60,80,45,-.3,0,7);x.fill()},
  dino(x){x.fillStyle='#43A047';x.beginPath();x.ellipse(-10,40,150,90,0,0,7);x.fill();x.beginPath();x.moveTo(100,0);x.quadraticCurveTo(150,-120,170,-140);x.lineTo(210,-120);x.quadraticCurveTo(180,-60,150,40);x.fill();
    x.beginPath();x.ellipse(195,-140,45,28,.2,0,7);x.fill();x.beginPath();x.moveTo(-140,20);x.quadraticCurveTo(-230,10,-240,90);x.quadraticCurveTo(-200,60,-130,80);x.fill();
    x.fillStyle='#2E7D32';for(let i=0;i<5;i++){x.beginPath();x.moveTo(-90+i*45,-40);x.lineTo(-70+i*45,-85);x.lineTo(-50+i*45,-40);x.fill()}
    x.fillStyle='#43A047';x.fillRect(-90,100,40,80);x.fillRect(40,100,40,80);x.fillStyle='#111';x.beginPath();x.arc(205,-148,7,0,7);x.fill()},
  blokken(x){const C=['#E53935','#1E88E5','#FDD835','#43A047'],L='ABCD';[[-110,40],[10,40],[-50,-80],[130,40]].forEach(([a,b],i)=>{x.fillStyle=C[i];rr(x,a-55,b-55,110,110,12);x.fill();
    x.fillStyle='rgba(255,255,255,.9)';x.font='900 70px Arial';x.textAlign='center';x.fillText(L[i],a,b+25)})},
  beer(x){x.fillStyle='#8D5A3B';for(const e of[-70,70]){x.beginPath();x.arc(e,-170,38,0,7);x.fill()}x.beginPath();x.arc(0,-100,95,0,7);x.fill();x.beginPath();x.ellipse(0,90,115,125,0,0,7);x.fill();
    for(const a of[-125,125]){x.beginPath();x.ellipse(a,60,40,70,a<0?.5:-.5,0,7);x.fill()}x.fillStyle='#D7B08C';x.beginPath();x.ellipse(0,-70,45,35,0,0,7);x.fill();x.beginPath();x.ellipse(0,100,65,70,0,0,7);x.fill();
    x.fillStyle='#222';for(const e of[-35,35]){x.beginPath();x.arc(e,-120,10,0,7);x.fill()}x.beginPath();x.ellipse(0,-82,14,10,0,0,7);x.fill()},
  trein(x){x.fillStyle='#1565C0';rr(x,-210,-40,280,120,16);x.fill();x.fillStyle='#E53935';rr(x,40,-150,150,230,16);x.fill();x.fillStyle='#BBDEFB';rr(x,70,-120,90,70,10);x.fill();
    x.fillStyle='#333';x.fillRect(-170,-130,50,95);x.fillStyle='#FDD835';for(const w of[-150,-40,120]){x.beginPath();x.arc(w,95,45,0,7);x.fill();x.fillStyle='#333';x.beginPath();x.arc(w,95,12,0,7);x.fill();x.fillStyle='#FDD835'}},
  xylofoon(x){x.fillStyle='#8D6E63';rr(x,-220,-120,30,240,8);x.fill();rr(x,190,-120,30,240,8);x.fill();const C=['#E53935','#FB8C00','#FDD835','#43A047','#1E88E5','#8E24AA'];
    C.forEach((c,i)=>{x.fillStyle=c;const h=220-i*25;rr(x,-180+i*62,-h/2,50,h,10);x.fill()});x.strokeStyle='#5D4037';x.lineWidth=12;x.beginPath();x.moveTo(-60,170);x.lineTo(120,120);x.stroke();x.fillStyle='#E53935';x.beginPath();x.arc(130,118,20,0,7);x.fill()}

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function toyCanvas(kind,v){
  const c=document.createElement('canvas');c.width=c.height=600;const x=c.getContext('2d');
  x.fillStyle=['#F2ECE3','#E6ECF0','#EDE6DA','#F6F1E7','#E3E8DF'][v%5];x.fillRect(0,0,600,600);
  x.globalAlpha=.07;x.fillStyle='#000';for(let i=0;i<13;i++)x.fillRect(0,i*48+(v*11)%48,600,3);x.globalAlpha=1;
  x.save();x.translate(300+[0,-22,25,-12][v%4],300+[0,15,-12,20][v%4]);x.rotate([0,-.2,.25,-.12][v%4]);const s=[.95,.82,1.02,.88][v%4];x.scale(s,s);
  if(v===3)x.scale(-1,1);PAINT[kind](x);x.restore();
  x.fillStyle='rgba(0,0,0,.08)';x.beginPath();x.ellipse(300,520,190,22,0,0,7);x.fill();return c;
}
function boxCanvas(type,color,label){
  const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d');
  x.fillStyle='#EFE7DC';x.fillRect(0,0,800,600);
  if(type==='locatie'){x.fillStyle='#C8A27A';x.fillRect(120,60,560,500);x.fillStyle='#F7EFE4';for(let i=0;i<3;i++)x.fillRect(145,85+i*160,510,135);
    const cols=['#FF8A65','#4FC3F7','#FFD54F','#81C784'];for(let i=0;i<3;i++)for(let j=0;j<3;j++){x.fillStyle=cols[(i+j+label.length)%4];rr(x,165+j*165,120+i*160,140,100,12);x.fill()}}
  else if(type==='doos'){x.fillStyle='#C9965E';x.beginPath();x.moveTo(150,200);x.lineTo(650,200);x.lineTo(620,540);x.lineTo(180,540);x.fill();x.fillStyle='#B07F48';x.beginPath();x.moveTo(150,200);x.lineTo(260,120);x.lineTo(760,120);x.lineTo(650,200);x.fill();x.fillStyle='rgba(240,230,200,.8)';x.fillRect(370,200,60,340)}
  else{x.fillStyle=color;x.beginPath();x.moveTo(110,170);x.lineTo(690,170);x.lineTo(640,540);x.lineTo(160,540);x.fill();x.fillStyle='rgba(0,0,0,.18)';rr(x,330,215,140,40,20);x.fill();x.fillStyle='rgba(255,255,255,.25)';x.fillRect(110,170,580,22)}
  x.fillStyle='#fff';rr(x,300,330,200,90,12);x.fill();x.fillStyle='#2A2340';x.font='900 46px Arial';x.textAlign='center';x.fillText(label,400,392);return c;
}
async function loadDemo(){
  if(S.items.size&&!await confirmBox('Voorbeelddata toevoegen aan je bestaande gegevens?',{ok:'Toevoegen'}))return;
  toast('Voorbeelddata maken…',2500);
  const mk=async(type,code,name,desc,parent,locText,color)=>{if(byCode(code))code=nextCode(type);const c={id:uid(),type,code,name,description:desc,parentId:parent||null,locationText:locText||'',created:Date.now()};
    const ph=await makePhoto(boxCanvas(type,color,code),'container',c.id);c.photoId=ph.id;await saveContainer(c);return c};
  const L1=await mk('locatie','L-001','Speelkamer – grote kast','Witte kast met 3 planken',null,'Speelkamer, links naast het raam');
  const L2=await mk('locatie','L-002','Zolder – rek','Metalen rek achteraan',null,'Zolder');
  const L3=await mk('locatie','L-003','Badkamer – mand','',null,'Badkamer');
  const B1=await mk('bak','B-001','Voertuigen','Auto\'s, treinen, vliegtuigjes',L1.id,'','#FF7043');
  const B2=await mk('bak','B-002','Knuffels & dieren','',L1.id,'','#4FC3F7');
  const B3=await mk('bak','B-003','Badspeelgoed','',L3.id,'','#FFD54F');
  const D1=await mk('doos','D-001','Bouwen & muziek','Blokken en instrumenten',L2.id,'');
  const items=[['auto','Rode raceauto','Met nummer 7',B1,'auto, rood, race'],['trein','Blauwe trein','Locomotief met rode cabine',B1,'trein, blauw'],['eend','Gele badeend','',B3,'bad, eend, geel'],
    ['dino','Groene dino','Stegosaurus',B2,'dino, dinosaurus, groen'],['beer','Bruine teddybeer','Knuffel van Juliette',B2,'knuffel, beer'],['blokken','ABC-blokken','4 houten blokken',D1,'blokken, letters, hout'],
    ['xylofoon','Regenboog-xylofoon','Met stokje',D1,'muziek, xylofoon'],['bal','Strandbal','Opblaasbaar',L2,'bal, strand, buiten']];
  const tests=[];
  for(const[k,name,desc,c,tags]of items){
    const it={id:uid(),name,description:desc,tags:tags.split(',').map(s=>s.trim()),containerId:c.id,photoIds:[],created:Date.now()};
    for(const v of[0,1]){const ph=await makePhoto(toyCanvas(k,v),'item',it.id);it.photoIds.push(ph.id)}
    await saveItem(it);
    const t=toyCanvas(k,v2(k));tests.push({canvas:t,url:t.toDataURL('image/jpeg',.7)});await sleep(0);
  }
  S.demoTests=tests.sort(()=>Math.random()-.5);
  toast('Voorbeelddata geladen ✓');tab('home');
}
function v2(k){return k.length%2?2:3}

/* ============ start ============ */
(async function start(){
  await Store.init();await loadAll();
  if(!handleHash())render();
  if(S.settings.ai)setTimeout(loadAI,1200);
  if('serviceWorker' in navigator&&isTopLevelWeb()&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
